<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrendDrop — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      background: #0f0a1e;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 2rem;
    }
    .icon {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(139,92,246,0.4);
    }
    .icon img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p { color: rgba(255,255,255,0.5); font-size: 0.95rem; max-width: 300px; line-height: 1.6; }
    button {
      margin-top: 0.5rem;
      padding: 0.75rem 2rem;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #a855f7;
      display: inline-block;
      animation: blink 1.4s ease-in-out infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity:0.2; } 40% { opacity:1; } }
    .dots { display: flex; align-items: center; justify-content: center; gap: 6px; }
  </style>
</head>
<body>
  <div class="icon">
    <img src="/assets/generated/pwa-icon.dim_512x512.png" alt="TrendDrop" />
  </div>
  <h1>You're Offline</h1>
  <p>No internet connection right now. Check your connection and try again.</p>
  <div class="dots">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>
  <button onclick="location.reload()">Try Again</button>
</body>
</html>
